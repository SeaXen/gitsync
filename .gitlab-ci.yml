# gitsync CI — runs the same checks as .github/workflows/ci.yml
# Hosted on GitLab because GitHub Actions is disabled for this account.

stages:
  - check

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

syntax-and-tests:
  stage: check
  image: python:3.8-slim
  before_script:
    # gitsync is a git tool: `gitsync ci` runs a real (offline) sync and needs
    # git on PATH. The slim image does not ship it.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - git --version
    - python3 --version
  script:
    # 1. python syntax
    - python3 -m py_compile gitsync/*.py
    # 2. shell syntax (installers)
    - bash -n install.sh
    - bash -n quickinstall.sh
    - bash -n bin/gitsync
    # 3. CLI smoke tests
    - PYTHONPATH=$CI_PROJECT_DIR python3 -m gitsync --version
    - PYTHONPATH=$CI_PROJECT_DIR python3 -m gitsync --help > /dev/null
    - PYTHONPATH=$CI_PROJECT_DIR python3 -m gitsync scopes | grep -q "GitHub"
    - PYTHONPATH=$CI_PROJECT_DIR python3 -m gitsync platforms --help > /dev/null
    - PYTHONPATH=$CI_PROJECT_DIR python3 -m gitsync routes --help > /dev/null
    - PYTHONPATH=$CI_PROJECT_DIR python3 -m gitsync verify --help > /dev/null
    # 4. logic tests (no network). A leaked socket or file is a bug: fail on it.
    - PYTHONPATH=$CI_PROJECT_DIR python3 -W error::ResourceWarning -m unittest tests.test_logic
    # 5. the same 5 checks `gitsync ci` runs, including the checksum manifest
    - PYTHONPATH=$CI_PROJECT_DIR python3 -m gitsync ci

webui-tests:
  stage: check
  image: mcr.microsoft.com/playwright/python:v1.40.0-jammy
  allow_failure: true
  rules:
    - when: manual
  script:
    - PYTHONPATH=$CI_PROJECT_DIR python3 -m unittest tests.test_webapp_playwright

real-platform-smoke:
  stage: check
  image: python:3.8-slim
  rules:
    - if: '$TEST_PLATFORM_CONFIG != null'
      when: manual
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
  script:
    - mkdir -p /tmp/gitsync-test/config /tmp/gitsync-test/data
    - echo "$TEST_PLATFORM_CONFIG" > /tmp/gitsync-test/config/config.json
    - export GITSYNC_CONFIG_DIR=/tmp/gitsync-test/config GITSYNC_DATA_DIR=/tmp/gitsync-test/data
    - PYTHONPATH=$CI_PROJECT_DIR python3 -m gitsync sync --dry-run
    - PYTHONPATH=$CI_PROJECT_DIR python3 -m gitsync sync
