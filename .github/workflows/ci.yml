name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the README promises 3.8+: pin both ends of that promise here.
        # GitHub Actions is disabled for this account, so GitLab (3.8) and
        # Forgejo run the same block; this matrix is for anyone who forks it.
        python: ["3.8", "3.10", "3.12", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Python version
        run: python3 --version

      - name: Python syntax (all modules)
        run: python3 -m py_compile gitsync/*.py

      - name: Shell syntax (installers)
        run: |
          bash -n install.sh
          bash -n quickinstall.sh
          bash -n bin/gitsync

      - name: CLI smoke tests
        run: |
          export PYTHONPATH=$PWD
          python3 -m gitsync --version
          python3 -m gitsync --help > /dev/null
          python3 -m gitsync scopes | grep -q "GitHub"
          python3 -m gitsync platforms --help > /dev/null
          python3 -m gitsync routes --help > /dev/null
          python3 -m gitsync verify --help > /dev/null
          python3 -m gitsync config export > /dev/null

      - name: Unit checks (tests/test_logic.py)
        run: |
          export PYTHONPATH=$PWD
          # P3-3: a leaked socket or file is a bug, not noise
          python3 -W error::ResourceWarning -m unittest tests.test_logic

      - name: CI self-check (gitsync ci)
        run: |
          export PYTHONPATH=$PWD
          python3 -m gitsync ci

  webui:
    name: webui
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Web UI Playwright tests
        run: |
          export PYTHONPATH=$PWD
          python3 -m unittest tests.test_webapp_playwright
