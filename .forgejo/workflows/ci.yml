name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Python version
        run: python3 --version

      - name: Python syntax (all modules)
        run: python3 -m py_compile gitsync/*.py

      - name: Shell syntax (installers)
        run: |
          bash -n install.sh
          bash -n quickinstall.sh
          bash -n bin/gitsync

      - name: CLI smoke tests
        run: |
          export PYTHONPATH=$PWD
          python3 -m gitsync --version
          python3 -m gitsync --help > /dev/null
          python3 -m gitsync scopes | grep -q "GitHub"
          python3 -m gitsync platforms --help > /dev/null
          python3 -m gitsync routes --help > /dev/null
          python3 -m gitsync verify --help > /dev/null

      - name: Unit checks (tests/test_logic.py)
        run: |
          export PYTHONPATH=$PWD
          python3 -W error::ResourceWarning -m unittest tests.test_logic

      - name: CI self-check (gitsync ci)
        run: |
          export PYTHONPATH=$PWD
          python3 -m gitsync ci

  real-platform-smoke:
    name: real-platform-smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out the repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Python version
        run: python3 --version

      - name: Real platform smoke
        env:
          TEST_PLATFORM_CONFIG: ${{ secrets.TEST_PLATFORM_CONFIG }}
        run: |
          if [ -z "$TEST_PLATFORM_CONFIG" ]; then echo "No TEST_PLATFORM_CONFIG provided; skipping."; exit 0; fi
          mkdir -p /tmp/gitsync-test/config /tmp/gitsync-test/data
          echo "$TEST_PLATFORM_CONFIG" > /tmp/gitsync-test/config/config.json
          export GITSYNC_CONFIG_DIR=/tmp/gitsync-test/config GITSYNC_DATA_DIR=/tmp/gitsync-test/data
          export PYTHONPATH=$PWD
          python3 -m gitsync sync --dry-run
          python3 -m gitsync sync
